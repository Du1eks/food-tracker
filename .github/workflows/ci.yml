# Na svaki push i pull request: lint, testovi logike i build (isti koraci kao lokalno).
# Build ne treba Supabase ključeve; app ih traži tek kad se pokrene.
name: CI

on:
  push:
  pull_request:

jobs:
  provera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
